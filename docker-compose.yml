services:
  olcrtc-manager:
    build:
      context: .
      args:
        PANEL_REF: main      # pin to a tag/commit and bump to update deliberately
        OLCRTC_REF: master   # same for the tunnel binary itself
    image: olcrtc-manager:local
    pull_policy: build
    container_name: olcrtc-manager
    restart: unless-stopped
    # creates a network namespace + veth + iptables/tc rules per client location
    # for isolation and speed limits - needs real net admin capability
    privileged: true
    environment:
      OLCRTC_MANAGER_ADDR: 0.0.0.0
    volumes:
      - /mnt/raid5/olcrtc/manager:/etc/olcrtc-manager
    # cgroup v1 net_cls,net_prio is used for per-client speed quotas; on a
    # cgroup-v2-only host that specific feature may no-op, everything else
    # (rooms, keys, rotation, traffic_gb quotas) still works.
    labels:
      - "traefik.enable=true"
      - "traefik.http.middlewares.internal-only.ipallowlist.sourcerange=192.168.0.0/16,172.16.0.0/12,10.0.0.0/10,127.0.0.1/8"
      - "traefik.http.routers.olcrtc-manager-admin.rule=Host(`olcrtc.${APP_DOMAIN:?set APP_DOMAIN in .env}`) && (Path(`/admin`) || PathPrefix(`/admin/`))"
      - "traefik.http.routers.olcrtc-manager-admin.priority=100"
      - "traefik.http.routers.olcrtc-manager-admin.entrypoints=websecure"
      - "traefik.http.routers.olcrtc-manager-admin.middlewares=internal-only"
      - "traefik.http.routers.olcrtc-manager.rule=Host(`olcrtc.${APP_DOMAIN:?set APP_DOMAIN in .env}`)"
      - "traefik.http.routers.olcrtc-manager.entrypoints=websecure"
      - "traefik.http.services.olcrtc-manager.loadbalancer.server.port=8888"
    networks:
      - proxy

  olcrtc-rotator:
    build:
      context: ./rotator
    command: ["/app/entrypoint.sh"]
    image: olcrtc-rotator:local
    pull_policy: build
    container_name: olcrtc-rotator
    restart: unless-stopped
    depends_on:
      - olcrtc-manager
    environment:
      PANEL_URL: https://olcrtc.${APP_DOMAIN:?set APP_DOMAIN in .env}
      PANEL_USER: ${OLCRTC_ROTATOR_PANEL_USER:?set the panel admin user in .env}
      PANEL_PASS: ${OLCRTC_ROTATOR_PANEL_PASS:?set the panel admin pass in .env}
      OLCRTC_ADMIN_PATH: /admin
      ROTATE_INTERVAL_HOURS: "12"
      ROOM_RETENTION_HOURS: "24"
      GOOGLE_EMAIL: ${OLCRTC_ROTATOR_GOOGLE_EMAIL:-}
      GOOGLE_PASSWORD: ${OLCRTC_ROTATOR_GOOGLE_PASSWORD:-}
      GOOGLE_TOTP_SECRET: ${OLCRTC_ROTATOR_GOOGLE_TOTP_SECRET:-}
      TELEGRAM_BOT_TOKEN: ${OLCRTC_ROTATOR_TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${OLCRTC_ROTATOR_TELEGRAM_CHAT_ID:-}
      WEB_UI_PORT: "8080"
      # Defaults to the panel admin user/pass above if left unset - only
      # override these if the rotator's own web UI should have separate
      # credentials from the olcrtc admin panel.
      WEB_UI_USER: ${OLCRTC_ROTATOR_WEB_UI_USER:-}
      WEB_UI_PASS: ${OLCRTC_ROTATOR_WEB_UI_PASS:-}
    volumes:
      - /mnt/raid5/olcrtc/rotator:/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.olcrtc-rotator.rule=Host(`olcrtc-rotator.${APP_DOMAIN:?set APP_DOMAIN in .env}`)"
      - "traefik.http.routers.olcrtc-rotator.entrypoints=websecure"
      - "traefik.http.routers.olcrtc-rotator.middlewares=internal-only"
      - "traefik.http.services.olcrtc-rotator.loadbalancer.server.port=8080"
    networks:
      - proxy

networks:
  proxy:
    external: true
