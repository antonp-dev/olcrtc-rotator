# STACK_ENV namespaces every collision-prone resource (container names, host
# volume paths, image tags, Traefik router/service names and hostnames) so a
# second environment (e.g. dev) can run alongside main on the same Docker
# host without clobbering it. Leave unset for the primary/prod stack; set to
# e.g. "-dev" (leading hyphen) for a second one.
services:
  olcrtc-manager:
    build:
      context: .
      args:
        PANEL_REF: main      # pin to a tag/commit and bump to update deliberately
        OLCRTC_REF: master   # same for the tunnel binary itself
    image: olcrtc-manager:local${STACK_ENV:-}
    pull_policy: build
    container_name: olcrtc-manager${STACK_ENV:-}
    restart: unless-stopped
    # creates a network namespace + veth + iptables/tc rules per client location
    # for isolation and speed limits - needs real net admin capability
    privileged: true
    environment:
      OLCRTC_MANAGER_ADDR: 0.0.0.0
    volumes:
      - /mnt/raid5/olcrtc/manager${STACK_ENV:-}:/etc/olcrtc-manager
    # cgroup v1 net_cls,net_prio is used for per-client speed quotas; on a
    # cgroup-v2-only host that specific feature may no-op, everything else
    # (rooms, keys, rotation, traffic_gb quotas) still works.
    labels:
      - "traefik.enable=true"
      - "traefik.http.middlewares.internal-only.ipallowlist.sourcerange=192.168.0.0/16,172.16.0.0/12,10.0.0.0/10,127.0.0.1/8"
      - "traefik.http.routers.olcrtc-manager-admin${STACK_ENV:-}.rule=Host(`olcrtc${STACK_ENV:-}.${APP_DOMAIN:?set APP_DOMAIN in .env}`) && (Path(`/admin`) || PathPrefix(`/admin/`))"
      - "traefik.http.routers.olcrtc-manager-admin${STACK_ENV:-}.priority=100"
      - "traefik.http.routers.olcrtc-manager-admin${STACK_ENV:-}.entrypoints=websecure"
      - "traefik.http.routers.olcrtc-manager-admin${STACK_ENV:-}.middlewares=internal-only"
      - "traefik.http.routers.olcrtc-manager${STACK_ENV:-}.rule=Host(`olcrtc${STACK_ENV:-}.${APP_DOMAIN:?set APP_DOMAIN in .env}`)"
      - "traefik.http.routers.olcrtc-manager${STACK_ENV:-}.entrypoints=websecure"
      - "traefik.http.services.olcrtc-manager${STACK_ENV:-}.loadbalancer.server.port=8888"
    networks:
      - proxy

  olcrtc-rotator:
    build:
      context: ./rotator
    command: ["/app/entrypoint.sh"]
    image: olcrtc-rotator:local${STACK_ENV:-}
    pull_policy: build
    container_name: olcrtc-rotator${STACK_ENV:-}
    restart: unless-stopped
    depends_on:
      - olcrtc-manager
    environment:
      # Forwarded into the container so failure/alert messages can tag which
      # environment they're from - everything else STACK_ENV touches below
      # is compose-side interpolation only, not visible to the process.
      STACK_ENV: ${STACK_ENV:-}
      PANEL_URL: https://olcrtc${STACK_ENV:-}.${APP_DOMAIN:?set APP_DOMAIN in .env}
      PANEL_USER: ${OLCRTC_ROTATOR_PANEL_USER:?set the panel admin user in .env}
      PANEL_PASS: ${OLCRTC_ROTATOR_PANEL_PASS:?set the panel admin pass in .env}
      OLCRTC_ADMIN_PATH: /admin
      ROTATE_INTERVAL_HOURS: "12"
      ROOM_RETENTION_HOURS: "24"
      GOOGLE_EMAIL: ${OLCRTC_ROTATOR_GOOGLE_EMAIL:-}
      GOOGLE_PASSWORD: ${OLCRTC_ROTATOR_GOOGLE_PASSWORD:-}
      GOOGLE_TOTP_SECRET: ${OLCRTC_ROTATOR_GOOGLE_TOTP_SECRET:-}
      TELEGRAM_BOT_TOKEN: ${OLCRTC_ROTATOR_TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${OLCRTC_ROTATOR_TELEGRAM_CHAT_ID:-}
      WEB_UI_PORT: "8080"
      # Defaults to the panel admin user/pass above if left unset - only
      # override these if the rotator's own web UI should have separate
      # credentials from the olcrtc admin panel.
      WEB_UI_USER: ${OLCRTC_ROTATOR_WEB_UI_USER:-}
      WEB_UI_PASS: ${OLCRTC_ROTATOR_WEB_UI_PASS:-}
    volumes:
      - /mnt/raid5/olcrtc/rotator${STACK_ENV:-}:/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.olcrtc-rotator${STACK_ENV:-}.rule=Host(`olcrtc-rotator${STACK_ENV:-}.${APP_DOMAIN:?set APP_DOMAIN in .env}`)"
      - "traefik.http.routers.olcrtc-rotator${STACK_ENV:-}.entrypoints=websecure"
      - "traefik.http.routers.olcrtc-rotator${STACK_ENV:-}.middlewares=internal-only"
      - "traefik.http.services.olcrtc-rotator${STACK_ENV:-}.loadbalancer.server.port=8080"
    networks:
      - proxy

networks:
  proxy:
    external: true
